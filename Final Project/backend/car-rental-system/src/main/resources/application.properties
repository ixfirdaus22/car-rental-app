spring.application.name=CarRentalSystem
# Server
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/car_rental_db1?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=2601@January
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Cleaner Logs
spring.jpa.properties.hibernate.format_sql=true


# JWT
jwt.token.secret=ksfsndlkfh4itwhlksfnlkejrlfsijelf

jwt.token.expiration.millis=3600000

# Data Initialization
spring.sql.init.mode=always
